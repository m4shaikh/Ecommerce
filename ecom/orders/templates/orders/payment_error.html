{% extends "base.html" %}

{% block title %}Payment Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 rounded-3 p-4">
                <div class="card-body">
                    <i class="fas fa-exclamation-circle fa-4x text-danger mb-3"></i>
                    <h2 class="text-danger fw-bold">Payment Error</h2>
                    <p class="text-muted mt-2">
                        {{ error_message|default:"Something went wrong while processing your payment. Please try again." }}
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-primary me-2">Back to Cart</a>
                        <a href="{% url 'shop:product_list' %}" class="btn btn-primary">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
